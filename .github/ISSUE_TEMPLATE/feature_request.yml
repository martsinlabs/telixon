name: Feature request
description: Propose a new capability or API change.
title: 'feat: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and why does the current API not cover it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A concrete API or behavior, if you have one in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shapes you weighed and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Prior art, references, or anything else that helps evaluation.
