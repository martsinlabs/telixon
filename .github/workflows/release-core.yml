name: Release @telixon/core

on:
  push:
    tags:
      - 'core@v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Same Google source cache as ci.yml conformance job. Reused if hit.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/core/oracle/.cache
          key: lpn-source-${{ hashFiles('packages/core/src/engine/PROVENANCE.json') }}

      - run: pnpm conformance

      - run: pnpm build

      # Re-validate published type entry points against the actual release commit.
      - run: pnpm dlx @arethetypeswrong/cli@latest --pack packages/core --ignore-rules cjs-resolves-to-esm no-resolution

      - name: Publish @telixon/core
        run: node ../../scripts/safe-publish.mjs --access public --provenance --no-git-checks
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
