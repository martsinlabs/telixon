name: Release @telixon/core

on:
  push:
    tags:
      - 'core@v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#core@v}
          PKG_VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm typecheck

      - run: pnpm test

      # Same Google source cache as ci.yml conformance job. Reused if hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/core/oracle/.cache
          key: lpn-source-${{ hashFiles('packages/core/src/engine/PROVENANCE.json') }}

      - run: pnpm conformance

      - run: pnpm build

      # Re-validate published type entry points against the actual release commit.
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack packages/core --ignore-rules cjs-resolves-to-esm no-resolution

      - name: Publish @telixon/core
        run: node ../../scripts/safe-publish.mjs --access public --provenance --no-git-checks
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
