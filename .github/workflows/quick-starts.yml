# The Angular quick starts install the published packages from npm, which the workspace never does. A
# weekly build proves the examples a newcomer opens on StackBlitz still install and build.
name: quick-starts

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays 04:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [quick-start, quick-start-material, quick-start-signal-forms]
    defaults:
      run:
        working-directory: examples/angular/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
