# The quick starts install the published packages from npm, which the workspace never does. A weekly
# build proves the examples a newcomer opens on StackBlitz still install and build.
name: quick-starts

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays 04:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - examples/angular/quick-start
          - examples/angular/quick-start-material
          - examples/angular/quick-start-signal-forms
          - examples/angular/quick-start-signal-forms-material
          - examples/web-components/quick-start
          - examples/web-components/quick-start-react
          - examples/web-components/quick-start-vue
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
