name: Release @telixon/web-components

on:
  push:
    tags:
      - 'web-components@v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-web-components-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#web-components@v}
          PKG_VERSION=$(node -p "require('./packages/web-components/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi

      # The examples typecheck against the built packages, which is why the build runs first.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Form association and custom states exist in browsers only. The suite runs in the three engines.
      - run: pnpm --filter @telixon/web-components test

      # Re-validate published type entry points against the actual release commit.
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack packages/web-components --ignore-rules cjs-resolves-to-esm no-resolution

      # pnpm publish rewrites `workspace:^` to the local versions, which consumers cannot install until those versions are on npm.
      - name: Verify the required @telixon/core and @telixon/web-sdk versions are published on npm
        run: |
          for PACKAGE in core web-sdk; do
            VERSION=$(node -p "require('./packages/$PACKAGE/package.json').version")
            if ! npm view @telixon/$PACKAGE@$VERSION version >/dev/null 2>&1; then
              echo "::error::@telixon/$PACKAGE@$VERSION is not published. Publish it first."
              exit 1
            fi
          done

      # A dependency with unreleased changes would ship under its old version, which consumers would install without them.
      - name: Verify @telixon/core and @telixon/web-sdk carry no unreleased changes
        run: |
          for PACKAGE in core web-sdk; do
            if awk '/^## \[Unreleased\]/{p=1;next} /^## \[/{p=0} p' packages/$PACKAGE/CHANGELOG.md | grep -q '^- '; then
              echo "::error::@telixon/$PACKAGE has unreleased changes in its changelog. Release it first."
              exit 1
            fi
          done

      - name: Publish @telixon/web-components
        run: node ../../scripts/safe-publish.mjs --access public --provenance --no-git-checks
        working-directory: packages/web-components
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
