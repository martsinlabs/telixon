name: Release @telixon/angular

on:
  push:
    tags:
      - 'angular@v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-angular-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#angular@v}
          PKG_VERSION=$(node -p "require('./packages/angular/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi

      # Build first: ng-packagr writes the publishable package into packages/angular/dist.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Re-validate published type entry points against the actual release commit.
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack packages/angular/dist --ignore-rules cjs-resolves-to-esm no-resolution

      # Fail fast: pnpm publish rewrites the `workspace:` ranges to the local versions,
      # but consumers cannot install the package if those versions are not on npm yet.
      - name: Verify the @telixon/core and @telixon/web-sdk versions are published on npm
        run: |
          for PACKAGE in core web-sdk; do
            VERSION=$(node -p "require('./packages/$PACKAGE/package.json').version")
            if ! npm view @telixon/$PACKAGE@$VERSION version >/dev/null 2>&1; then
              echo "::error::@telixon/$PACKAGE@$VERSION is not published. Publish it first."
              exit 1
            fi
          done

      - name: Publish @telixon/angular
        run: node ../../scripts/safe-publish.mjs --access public --provenance --no-git-checks
        working-directory: packages/angular
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
