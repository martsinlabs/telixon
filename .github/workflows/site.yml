name: Site

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'examples/angular/material/**'
      - 'examples/angular/kitchen-sink/src/app/docs/**'
      - 'packages/angular/**'
      - 'scripts/check-links.mjs'
      - 'scripts/sync-demos.mjs'
      - '.github/workflows/site.yml'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'examples/angular/material/**'
      - 'examples/angular/kitchen-sink/src/app/docs/**'
      - 'packages/angular/**'
      - 'scripts/check-links.mjs'
      - 'scripts/sync-demos.mjs'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One site pipeline per ref; abandon superseded preview runs, never a production deploy.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The landing page bundles @telixon/core and @telixon/web-sdk, so packages build first.
      - run: pnpm build

      - run: pnpm --filter @telixon/docs build

      - run: pnpm --filter @telixon/docs check:links

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/docs/dist
          if-no-files-found: error

  deploy-preview:
    # Fork pull requests have no secrets; previews are for same-repo branches only.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=telixon-landing --branch=${{ github.head_ref }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const marker = '<!-- site-preview -->';
            const body = `${marker}\nSite preview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: site-production
      url: https://telixon.dev
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=telixon-landing --branch=main
