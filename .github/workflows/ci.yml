name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm test

      - run: pnpm build

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Google's source is fetched once per engine commit, then cached.
      - uses: actions/cache@v4
        with:
          path: packages/core/conformance/.cache
          key: lpn-source-${{ hashFiles('packages/core/src/engine/PROVENANCE.json') }}

      - run: pnpm typecheck:conformance

      - run: pnpm conformance

      # Parity artifacts produced by the conformance run (parity.json, parity-badge.json, parity.html).
      # Picked up by the pages job for deployment.
      - uses: actions/upload-artifact@v4
        with:
          name: parity-artifacts
          path: packages/core/conformance/dist
          if-no-files-found: error

  pages:
    needs: conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: parity-artifacts
          path: parity-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: parity-site

      - id: deployment
        uses: actions/deploy-pages@v4
