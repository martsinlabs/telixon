name: Release @telixon/web-sdk

on:
  push:
    tags:
      - 'web-sdk@v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-web-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#web-sdk@v}
          PKG_VERSION=$(node -p "require('./packages/web-sdk/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi

      # Build first: the bundle-size example typechecks against the built package.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Re-validate published type entry points against the actual release commit.
      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack packages/web-sdk --ignore-rules cjs-resolves-to-esm no-resolution

      # Fail fast: pnpm publish would rewrite `workspace:*` to the local core version,
      # but consumers cannot install web-sdk if that core version is not on npm yet.
      - name: Verify @telixon/core required version is published on npm
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          if ! npm view @telixon/core@$CORE_VERSION version >/dev/null 2>&1; then
            echo "::error::@telixon/core@$CORE_VERSION is not published. Publish core first."
            exit 1
          fi

      - name: Publish @telixon/web-sdk
        run: node ../../scripts/safe-publish.mjs --access public --provenance --no-git-checks
        working-directory: packages/web-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
