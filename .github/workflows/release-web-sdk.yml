name: Release @telixon/web-sdk

on:
  push:
    tags:
      - 'web-sdk@v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-web-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Re-validate published type entry points against the actual release commit.
      - run: pnpm dlx @arethetypeswrong/cli@latest --pack packages/web-sdk --ignore-rules cjs-resolves-to-esm

      # Fail fast: pnpm publish would rewrite `workspace:*` to the local core version,
      # but consumers cannot install web-sdk if that core version is not on npm yet.
      - name: Verify @telixon/core required version is published on npm
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          if ! npm view @telixon/core@$CORE_VERSION version >/dev/null 2>&1; then
            echo "::error::@telixon/core@$CORE_VERSION is not published. Publish core first."
            exit 1
          fi

      - name: Publish @telixon/web-sdk
        run: node ../../scripts/safe-publish.mjs --access public --provenance --no-git-checks
        working-directory: packages/web-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
